services:
  - type: web
    name: omniocr
    runtime: python
    plan: starter
    region: oregon
    healthCheckPath: /health
    buildCommand: ./build.sh
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONUNBUFFERED
        value: "1"
